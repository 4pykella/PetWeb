<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Miki</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
</head>

<body>
    <div class="header-buttons">
        <button id="home-toggle" class="theme-btn" aria-label="На главную"
            onclick="window.location.href='https://www.chepykella.ru'">🏠</button>
        <button id="theme-toggle" class="theme-btn" aria-label="Сменить тему">🌙</button>
        <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Меню">☰</button>
    </div>
    <div class="menu-overlay" id="menu-overlay"></div>
    <div class="miki-container">
        <aside class="sidebar">
            <h2>Miki</h2>
            <input type="text" id="search" placeholder="Поиск..."
                style="width: auto; padding:5px; margin-bottom:10px; border-radius:4px; border:1px solid var(--text-secondary); background: var(--bg-primary); color: var(--text-primary);">
            <ul id="nav"></ul>
        </aside>

        <main class="content">
            <div id="content" class="card">Выберите тему из списка</div>
        </main>
    </div>
    <div class="bg-pattern"></div>
    <script src="app.js"></script>
</body>

</html>
