# Сервисы Homepage. Документация: https://gethomepage.dev/configs/services/
# server: local + container — статус и нагрузка контейнера (docker.yaml)
# siteMonitor — HTTP-проверка изнутри docker-сети (не зависит от NAT/DNS)
# {{HOMEPAGE_VAR_*}} — значения из .env (см. docker-compose.yml → homepage)

- Мониторинг:
    - Сервер:
        icon: mdi-server
        description: Archimedes — node-exporter
        href: https://grafana.chepykella.ru/
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          refreshInterval: 15000
          metrics:
            - label: CPU
              query: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100
              format:
                type: percent
                options:
                  maximumFractionDigits: 1
            - label: RAM
              query: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              format:
                type: percent
                options:
                  maximumFractionDigits: 1
            - label: Диск /
              query: max((1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100)
              format:
                type: percent
                options:
                  maximumFractionDigits: 1
            - label: Темп.
              query: max(node_thermal_zone_temp)
              format:
                type: number
                suffix: "°C"
                options:
                  maximumFractionDigits: 1

    - Нагрузка:
        icon: mdi-chart-line
        description: Load average, сеть, аптайм
        href: https://prometheus.chepykella.ru/
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          refreshInterval: 15000
          metrics:
            - label: Load 1m
              query: node_load1
              format:
                type: number
                options:
                  maximumFractionDigits: 2
            - label: Входящий
              query: sum(rate(node_network_receive_bytes_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])) * 8
              format:
                type: bitrate
            - label: Исходящий
              query: sum(rate(node_network_transmit_bytes_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])) * 8
              format:
                type: bitrate
            - label: Аптайм
              query: time() - node_boot_time_seconds
              format:
                type: duration

    - Nginx:
        icon: nginx.png
        description: Запросы и соединения
        server: local
        container: nginx
        siteMonitor: http://nginx/nginx_status
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          refreshInterval: 15000
          metrics:
            - label: Запросов/с
              query: sum(rate(nginx_http_requests_total[5m]))
              format:
                type: number
                options:
                  maximumFractionDigits: 2
            - label: Активных
              query: sum(nginx_connections_active)
              format:
                type: number
            - label: Nginx up
              query: max(nginx_up)
              format:
                type: number

    - Prometheus:
        icon: prometheus.png
        href: https://prometheus.chepykella.ru/targets
        description: Цели сбора метрик
        server: local
        container: prometheus
        siteMonitor: http://prometheus:9090/-/healthy
        widget:
          type: prometheus
          url: http://prometheus:9090

    - Grafana:
        icon: grafana.png
        href: https://grafana.chepykella.ru/
        description: Дашборды
        server: local
        container: grafana
        siteMonitor: http://grafana:3000/api/health
        widget:
          type: grafana
          url: http://grafana:3000
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"

