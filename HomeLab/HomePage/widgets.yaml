---
# Информационные виджеты в шапке. https://gethomepage.dev/configs/info-widgets/

- logo:
    icon: https://www.svgrepo.com/show/442994/brand-cthulhu.svg

- resources:
    label: Archimedes
    expanded: true
    cpu: true
    memory: true
    cputemp: true
    tempmin: 30
    tempmax: 85
    units: metric
    uptime: true
    refresh: 3000

- resources:
    label: Диск
    expanded: true
    disk: /

- datetime:
    text_size: md
    locale: ru
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23

- openmeteo:
    label: Санкт-Петербург
    latitude: 59.9386
    longitude: 30.3141
    timezone: Europe/Moscow
    units: metric
    cache: 15

- search:
    provider: google
    target: _blank
