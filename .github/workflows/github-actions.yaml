name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Не запускаем два деплоя одновременно
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/petweb

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Miki tree and music playlist
        run: |
          node html/miki/generateFiles.js
          node html/music/generatePlaylist.js

      - name: Check bot syntax
        working-directory: bot
        run: |
          npm ci --omit=dev
          node --check index.js

      - name: Check shell scripts
        run: bash -n cert.sh scripts/deploy.sh nginx/entrypoint.sh

      - name: Validate docker compose
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build Docker images
        run: docker compose build --pull nginx workdays-bot

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: petweb

      - name: Generate Miki tree and music playlist
        run: |
          node petweb/html/miki/generateFiles.js
          node petweb/html/music/generatePlaylist.js

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $SSH_HOST
            Port $SSH_PORT
            User ${{ secrets.SSH_USERNAME }}
            IdentityFile ~/.ssh/id_deploy
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
          ssh deploy "echo 'SSH connection successful'"

      # .env с паролями лежит только на сервере (шаблон — .env.example) и не перезаписывается
      - name: Upload project
        run: |
          tar -C petweb --exclude='./.git' --exclude='./.github' -czf /tmp/petweb.tar.gz .
          ssh deploy "mkdir -p '${{ env.DEPLOY_PATH }}'"
          scp /tmp/petweb.tar.gz deploy:/tmp/petweb.tar.gz
          ssh deploy "tar -xzf /tmp/petweb.tar.gz -C '${{ env.DEPLOY_PATH }}' && rm -f /tmp/petweb.tar.gz"

      - name: Deploy
        run: ssh deploy "bash '${{ env.DEPLOY_PATH }}/scripts/deploy.sh'"

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh /tmp/petweb.tar.gz
