name: СI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/petweb

jobs:
  build:
    name: Build Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          docker compose version

      - name: Validate Docker Compose
        run: |
          docker compose config -q

      - name: Build Docker images
        run: |
          docker compose build --pull

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
      
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Check SSH connection
        run: |
          ssh \
             \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Prepare server directory
        run: |
          ssh \
             \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}'"

      - name: Upload project
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            -czf /tmp/petweb.tar.gz .

          scp \
             \
            -i ~/.ssh/id_ed25519 \
            /tmp/petweb.tar.gz \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/tmp/petweb.tar.gz"

      - name: Deploy project
        run: |
          ssh \
             \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            DEPLOY_PATH="/opt/petweb"

            echo "======================================"
            echo "Deploying PetWeb"
            echo "======================================"

            echo "[1/6] Extracting project..."

            mkdir -p "$DEPLOY_PATH"

            tar \
              -xzf /tmp/petweb.tar.gz \
              -C "$DEPLOY_PATH"

            rm -f /tmp/petweb.tar.gz

            cd "$DEPLOY_PATH"

            echo "[2/6] Validating Docker Compose..."

            docker compose config -q

            echo "[3/6] Stopping old containers..."

            docker compose down --remove-orphans || true

            echo "[4/6] Obtaining SSL certificates..."

            chmod +x ./cert.sh

            ./cert.sh

            echo "[5/6] Starting Docker Compose..."

            docker compose up -d --build

            echo "[6/6] Checking containers..."

            sleep 10

            docker compose ps

            if docker compose ps --status running | grep -q "running"; then
              echo "======================================"
              echo "Deployment successful"
              echo "======================================"
            else
              echo "======================================"
              echo "Deployment failed"
              echo "======================================"

              docker compose ps
              docker compose logs --tail=100

              exit 1
            fi

          EOF

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          rm -f ~/.ssh/known_hosts
          rm -f /tmp/petweb.tar.gz

