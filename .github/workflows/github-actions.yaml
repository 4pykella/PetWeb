name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Не запускаем два деплоя одновременно
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/petweb

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Miki tree (files.json)
        run: node html/miki/generateFiles.js

      - name: Check bot syntax
        working-directory: bot
        run: |
          npm ci --omit=dev
          node --check index.js

      - name: Check shell scripts
        run: bash -n cert.sh scripts/deploy.sh nginx/entrypoint.sh

      - name: Validate docker compose
        run: |
          touch .env
          docker compose config -q

      - name: Build Docker images
        run: docker compose build --pull nginx workdays-bot

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: petweb

      - name: Generate Miki tree (files.json)
        run: node petweb/html/miki/generateFiles.js

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $SSH_HOST
            Port $SSH_PORT
            User ${{ secrets.SSH_USERNAME }}
            IdentityFile ~/.ssh/id_deploy
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
          ssh deploy "echo 'SSH connection successful'"

      # .env собирается из секретов репозитория.
      # Пустые секреты → в compose сработают значения по умолчанию.
      - name: Render .env
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_ADMIN_IDS: ${{ secrets.BOT_ADMIN_IDS }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          CODE_SERVER_PASSWORD: ${{ secrets.CODE_SERVER_PASSWORD }}
          DOMAIN: ${{ vars.DOMAIN || 'chepykella.ru' }}
        run: |
          cd petweb
          umask 077
          {
            echo "DOMAIN=$DOMAIN"
            echo "BOT_TOKEN=$BOT_TOKEN"
            echo "BOT_ADMIN_IDS=$BOT_ADMIN_IDS"
            echo "GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD"
            echo "CODE_SERVER_PASSWORD=$CODE_SERVER_PASSWORD"
          } > .env

      - name: Upload project
        run: |
          tar -C petweb --exclude='./.git' --exclude='./.github' -czf /tmp/petweb.tar.gz .
          ssh deploy "mkdir -p '${{ env.DEPLOY_PATH }}'"
          scp /tmp/petweb.tar.gz deploy:/tmp/petweb.tar.gz
          ssh deploy "tar -xzf /tmp/petweb.tar.gz -C '${{ env.DEPLOY_PATH }}' && rm -f /tmp/petweb.tar.gz \
            && chmod 600 '${{ env.DEPLOY_PATH }}/.env'"

      - name: Deploy
        run: ssh deploy "bash '${{ env.DEPLOY_PATH }}/scripts/deploy.sh'"

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh /tmp/petweb.tar.gz petweb/.env
