events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Редирект HTTP → HTTPS (для всех поддоменов)
    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        # метрики для nginx-exporter — только из docker-сети
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        http2 on;
        server_name www.chepykella.ru chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # Portainer
        location /portainer/ {
            proxy_pass http://portainer:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Музыка для скрытого плеера: список папки отдаётся JSON-ом,
        # поэтому новые файлы в html/music/ появляются без перезапуска
        location /music/ {
            root /usr/share/nginx/html;
            autoindex on;
            autoindex_format json;
            types {
                audio/mpeg mp3;
                audio/ogg ogg oga opus;
                audio/mp4 m4a;
                audio/aac aac;
                audio/flac flac;
                audio/wav wav;
                audio/webm webm;
                application/json json;
                text/plain md js;
            }
            add_header Cache-Control "public, max-age=3600";
        }

        # Ваш сайт
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
    
    # Блок для Grafana
    server {
        listen 443 ssl;
        http2 on;
        server_name grafana.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Блок для Prometheus
    server {
        listen 443 ssl;
        http2 on;
        server_name prometheus.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

#   Заготовка для home.chepykella
    server {
        listen 443 ssl;
        http2 on;
        server_name home.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://homepage:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nextcloud переехал на свой поддомен: в подпапке он редиректит на /login без префикса → 404
        location /nextcloud/ {
            return 301 https://cloud.chepykella.ru/;
        }
    }

    # Nextcloud (приложение TrueNAS) на собственном поддомене
    server {
        listen 443 ssl;
        http2 on;
        server_name cloud.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 10G;
        proxy_request_buffering off;   # большие загрузки идут потоком, без буфера на диске
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # CalDAV / CardDAV для клиентов
        location = /.well-known/carddav { return 301 https://$host/remote.php/dav/; }
        location = /.well-known/caldav  { return 301 https://$host/remote.php/dav/; }

        location / {
            proxy_pass http://94.19.145.226:30027;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 2. Proxmox VE (Требует https и отключение верификации SSL бэкенда)
    server {
        listen 443 ssl;
        http2 on;
        server_name proxmox.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;

        location / {
            proxy_pass https://94.19.145.226:8006; # Обратите внимание на https
            proxy_ssl_verify off;                 # Игнорируем самоподписанный SSL Proxmox
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Поддержка WebSockets (критично для консоли VNC в Proxmox)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 3. TrueNAS
    server {
        listen 443 ssl;
        http2 on;
        server_name truenas.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;

        location / {
            proxy_pass https://94.19.145.226:8443; # Также через https
            proxy_ssl_verify off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 4. VS Code (code-server)
    server {
        listen 443 ssl;
        http2 on;
        server_name code.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;

        location / {
            proxy_pass http://code-server:8443/; # Тут обычный http
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Веб-сокеты для терминала среды разработки
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 5. OpenWRT
    server {
        listen 443 ssl;
        http2 on;
        server_name openwrt.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;

        location / {
            proxy_pass https://94.19.145.226:443; # Луси/uHTTPd обычно на https
            proxy_ssl_verify off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
