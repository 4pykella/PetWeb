events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Редирект HTTP → HTTPS
    server {
        listen 80;
        server_name www.chepykella.ru chepykella.ru;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://www.chepykella.ru$request_uri;
        }
        location /nginx_status {
            stub_status;
            allow all;
        }
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        http2 on;
        server_name www.chepykella.http ;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # Portainer
        location /portainer/ {
            proxy_pass http://portainer:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Ваш сайт
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
    
    # Блок для Grafana
    server {
        listen 443 ssl;
        http2 on;
        server_name grafana.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Блок для Prometheus
    server {
        listen 443 ssl;
        http2 on;
        server_name prometheus.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

#   Заготовка для home.chepykella
    server {
        listen 443 ssl;
        http2 on;
        server_name home.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://homepage:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nextcloud/ {
            proxy_pass http://94.19.145.226:30027/; # Слэш на конце обязателен!
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10G;
        }
    }

    # 2. Proxmox VE (Требует https и отключение верификации SSL бэкенда)
    server {
        listen 443 ssl;
        http2 on;
        server_name proxmox.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;

        location / {
            proxy_pass https://94.19.145.226:8006; # Обратите внимание на https
            proxy_ssl_verify off;                 # Игнорируем самоподписанный SSL Proxmox
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Поддержка WebSockets (критично для консоли VNC в Proxmox)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 3. TrueNAS
    server {
        listen 443 ssl;
        http2 on;
        server_name truenas.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;

        location / {
            proxy_pass https://94.19.145.226:8443; # Также через https
            proxy_ssl_verify off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 4. VS Code (code-server)
    server {
        listen 443 ssl;
        http2 on;
        server_name code.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;

        location / {
            proxy_pass http://code-server:8443/; # Тут обычный http
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Веб-сокеты для терминала среды разработки
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 5. OpenWRT
    server {
        listen 443 ssl;
        http2 on;
        server_name openwrt.chepykella.ru;

        ssl_certificate /etc/letsencrypt/live/www.chepykella.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.chepykella.ru/privkey.pem;

        location / {
            proxy_pass https://94.19.145.226:443; # Луси/uHTTPd обычно на https
            proxy_ssl_verify off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
