services:
  nginx:
    build: ./nginx
    container_name: nginx
    environment:
      - DOMAIN=${DOMAIN:-chepykella.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    networks:
      - monitoring
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    # новые версии экспортера читают адрес только из флага (env игнорируется);
    # порт наружу не публикуем — Prometheus ходит по docker-сети
    command:
      - --nginx.scrape-uri=http://nginx/nginx_status
    depends_on:
      - nginx
    networks:
      - monitoring
    restart: unless-stopped

  # Продление wildcard-сертификата по DNS-01 (выпуск — ./cert.sh, см. CI/CD).
  # Данные/ключи API берутся из data/acme, куда их сохранил первый выпуск.
  acme:
    image: neilpang/acme.sh:latest
    container_name: acme
    command: daemon
    volumes:
      - ./data/acme:/acme.sh
      - ./data/certbot/conf:/certs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=https://prometheus.chepykella.ru'
      - '--web.route-prefix=/'
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.chepykella.ru
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: "host"
    networks:
      - monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
    networks:
      - monitoring
    ports:
      - 3000:3000
    volumes:
      - ./HomeLab/HomePage:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
    restart: unless-stopped


  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=${CODE_SERVER_PASSWORD:-Selectel_password}
      - PROXY_DOMAIN=code.chepykella.ru
    volumes:
      - ./code-server-config:/config
    ports:
      - 10443:8443
    networks:            # <--- Добавили контейнер в общую сеть с Nginx
      - monitoring
    restart: unless-stopped

  # Telegram-бот графика рабочих дней
  workdays-bot:
    build: ./bot
    container_name: workdays-bot
    environment:
      - TOKEN=${BOT_TOKEN:-}
      - TZ=${TZ:-Europe/Moscow}
      - SCHEDULE_START=${SCHEDULE_START:-2026-09-04}
      - SCHEDULE_PATTERN=${SCHEDULE_PATTERN:-N,N,O,O,O,D,D,O}
      - PERSON_TAG=${PERSON_TAG:-@chepykella}
      - ADMIN_IDS=${BOT_ADMIN_IDS:-}
      - DATA_DIR=/app/data
    volumes:
      - bot_data:/app/data
    networks:
      - monitoring
    restart: on-failure

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  portainer_data:
  bot_data:
