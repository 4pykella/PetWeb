# GitLab CI/CD — аналог .github/workflows/github-actions.yaml
# Переменные (Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY  (File, Protected, Masked)  — приватный ключ деплоя
#   SSH_HOST, SSH_USER, SSH_PORT (опц.)
# Пароли и токены — в /opt/petweb/.env на сервере (шаблон .env.example), CI их не трогает.
# Подробности: html/miki/docs/GitLab/Гайд.md

stages:
  - build
  - deploy

variables:
  DEPLOY_PATH: /opt/petweb
  DOMAIN: chepykella.ru

validate:
  stage: build
  image: node:20-alpine
  script:
    - node html/miki/generateFiles.js
    - node html/music/generatePlaylist.js
    - cd bot && npm ci --omit=dev && node --check index.js

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - cp .env.example .env
    - docker compose config -q
    - docker compose build --pull
    - docker build -t workdays-bot:ci ./bot   # бот — отдельный проект, только проверка сборки

deploy:
  stage: deploy
  image: alpine:3.20
  needs: [validate, docker-build]
  environment:
    name: production
    url: https://www.$DOMAIN
  resource_group: production   # не даём двум деплоям идти параллельно
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
    - printf 'Host deploy\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n' "$SSH_HOST" "${SSH_PORT:-22}" "$SSH_USER" > ~/.ssh/config
  script:
    # /opt/petweb — git-клон; .env, data/ и музыка не в git и не затрагиваются
    - ssh deploy "cd '$DEPLOY_PATH' && git fetch --prune origin main && git reset --hard origin/main && bash scripts/deploy.sh"
  after_script:
    - rm -rf ~/.ssh
