# wg-easy v15 — WireGuard с веб-интерфейсом. Разворачивается на VDS, отдельно от PetWeb.
#   cp .env.example .env && nano .env && docker compose up -d
# По умолчанию UI слушает только 127.0.0.1 → заходить через SSH-туннель (README.md).
# HTTPS-доступ по домену: docker compose --profile https up -d  (Caddy, сертификат сам)

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    environment:
      # --- первый запуск (unattended setup): действуют один раз, потом игнорируются ---
      - INIT_ENABLED=true
      - INIT_USERNAME=${WG_ADMIN_USER:?задай WG_ADMIN_USER в .env}
      - INIT_PASSWORD=${WG_ADMIN_PASSWORD:?задай WG_ADMIN_PASSWORD в .env}
      - INIT_HOST=${WG_HOST:?задай WG_HOST (публичный IP или домен VDS) в .env}
      - INIT_PORT=${WG_PORT:-51820}
      - INIT_DNS=${WG_DNS:-1.1.1.1,8.8.8.8}
      # --- постоянные настройки ---
      - PORT=51821
      - HOST=0.0.0.0
      # UI доступен по http только локально (SSH-туннель) или через Caddy с HTTPS
      - INSECURE=true
      - TRUSTED_PROXIES=10.42.42.43
      - DISABLE_IPV6=${WG_DISABLE_IPV6:-false}
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
      # веб-интерфейс: по умолчанию только localhost VDS
      - "${WG_UI_BIND:-127.0.0.1}:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped

  # HTTPS для веб-интерфейса по домену (WG_UI_DOMAIN → A-запись на VDS).
  # Включается только с профилем: docker compose --profile https up -d
  caddy:
    image: caddy:2
    container_name: wg-easy-caddy
    profiles: ["https"]
    environment:
      - WG_UI_DOMAIN=${WG_UI_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      wg:
        ipv4_address: 10.42.42.43
    depends_on:
      - wg-easy
    restart: unless-stopped

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64

volumes:
  etc_wireguard:
  caddy_data:
  caddy_config:
